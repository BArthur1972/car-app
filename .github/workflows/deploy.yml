name: Deploy

on:
  workflow_dispatch:

env:
  ACR_NAME: carsregistry
  BACKEND_APP: cars-backend
  FRONTEND_APP: cars-frontend
  RG: cars-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and push backend
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$BACKEND_APP:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$BACKEND_APP:latest \
            ./backend
          docker push $ACR_NAME.azurecr.io/$BACKEND_APP:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$BACKEND_APP:latest

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ secrets.BACKEND_URL }} \
            -t $ACR_NAME.azurecr.io/$FRONTEND_APP:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$FRONTEND_APP:latest \
            ./frontend
          docker push $ACR_NAME.azurecr.io/$FRONTEND_APP:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$FRONTEND_APP:latest

      - name: Deploy backend
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RG \
            --image $ACR_NAME.azurecr.io/$BACKEND_APP:${{ github.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RG \
            --image $ACR_NAME.azurecr.io/$FRONTEND_APP:${{ github.sha }}
