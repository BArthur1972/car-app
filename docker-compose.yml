services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    ports:
      - "8081:8081"
      - "1234:1234"
    volumes:
      # Named volume persists database state across container restarts.
      # If needed, reset with: docker compose down -v && docker compose up
      - cosmos-data:/tmp/cosmos/appdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # 5292: External port accessible from host/frontend browser
      # 8080: Internal ASP.NET Core port (ASPNETCORE_URLS)
      - "5292:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Internal Docker network address for Cosmos emulator connection.
      - CosmosDB__CosmosAccountOptions__AccountEndpoint=http://cosmos-emulator:8081
      # Enable container-specific networking workarounds for Cosmos emulator
      - CosmosDB__CosmosAccountOptions__RunningInContainer=true
      # JWT certificate — set JWT_CERT_BASE64 in the .env file at the project root (gitignored)
      - Jwt__CertificateBase64=${JWT_CERT_BASE64}
    depends_on:
      cosmos-emulator:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server-side backend URL
      # Client requests will be proxied through /api routes to the backend
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  cosmos-data:
